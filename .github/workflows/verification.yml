name: Vérification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # Node exécute la démo web, pour vérifier qu'elle calcule exactement comme Python.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pip install -r requirements.txt
      - run: python -m unittest -v

  banc-essai:
    name: Banc d'essai et démo
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 1 000 scènes par pilote, avec et sans garde-fou
        run: python evaluer.py
      - name: Préparer la démo pour GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  publier:
    name: Publier la démo
    needs: banc-essai
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    # Tant que GitHub Pages n'est pas activé sur le dépôt, cette étape échoue sans bloquer la vérification.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
